[package]
name = "trv_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "trv_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
cpal = "0.15"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qrcode = "0.12"
base64 = "0.22"
